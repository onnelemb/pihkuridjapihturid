<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>pihikamber</title>
<style>



/*m2lestades pihikamber.com'i. rip flyhigh vms*/
/*#florianwahl #salajanebaar #matrix #kakshotdogiigakastmega #oole #trakuinice #kumme?kumme-kumme?*/

html, body {
  overflow: hidden;
  touch-action: manipulation;
  overscroll-behavior: none;
}

body { 
  font-family: monospace; 
  margin:0; 
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  background: #f8f8f8;
}
.hidden { display:none; }
.center {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  font-size: 1.15em;
}
input, button, textarea {
  width:100%;
  max-width:380px;
  margin-top:12px;
  padding:15px;
  font-size: 18px;
  border-radius: 0;
  -webkit-appearance: none;
  border: 1px solid #999;
  background: #fefefe;
  color: #111;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
}
textarea {
  height:120px;
  resize:none;
}
button {
  background: #e8e8e8;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  border: 1px solid #888;
  transition: all 0.18s ease-in-out;
}
button:hover { background: #ddd; border-color: #666; }
button:active { transform: scale(0.96); background: #d0d0d0; border-color: #555; }
button:disabled { opacity: 0.6; cursor: not-allowed; background: #eee; }

#messages {
  width:100%;
  max-width:460px;
  height:420px;
  overflow-y:auto;
  background: #fff;
  padding: 12px;
  border: 1px solid #ddd;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  position: relative;
}
.message {
  border-top: 1px solid #eee;
  padding: 12px 0;
  position: relative;           /*pihi nr jaoks vajalikvist*/
  min-height: 60px;
}
.message small { color: #777; font-size: 0.85em; }
.piht-nr {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 0.9em;
  color: #999;
  font-weight: bold;
  background: rgba(255,255,255,0.7);
  padding: 2px 6px;
  border-radius: 3px;
  z-index: 1;
}

.like-btn {
  cursor: pointer;
  user-select: none;
  font-size: 1.45em;
  margin-left: 8px;
  display: inline-block;
  transition: transform 0.18s ease, color 0.18s ease;
}
.like-btn.liked { color: #e74c3c; }
.like-btn:hover { opacity: 0.85; }
.like-count { font-size: 0.95em; color: #777; margin-left: 5px; }

#cooldown-msg {
  color: #e74c3c;
  font-size: 0.95em;
  margin-top: 6px;
  min-height: 1.2em;
  text-align: center;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div id="page1" class="center">
  <center>youkiyou<br/>kui oled uustulnud sangar,<br/>on salasonaks yks mees, aga ta<br/>pole lihtsalt mees...<br/>ta on siuke andega mees<br/><br/></center>
  <input id="password" type="password" placeholder="parool">
  <button id="enterBtn">ava</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="center hidden" style="display:none; flex-direction:column;">
  <div id="messages"></div>
  <div style="width:100%; max-width:460px; margin-top:10px;">
    <textarea id="messageInput" placeholder="pne tilka..."></textarea>
    <button id="sendBtn">pihi!</button>
    <div id="cooldown-msg"></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
//config
const firebaseConfig = {
  apiKey: "SIIN",
  authDomain: "SIIN",
  projectId: "pihukamber"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

//i got 2 fones
document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});

//1min cooldown
let cooldownInterval = null;
function startCooldown(secondsLeft) {
  const msgEl = document.getElementById("cooldown-msg");
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  msgEl.textContent = `aitah kirjuta ${secondsLeft} sek prst uuesti`;

  if (cooldownInterval) clearInterval(cooldownInterval);
  cooldownInterval = setInterval(() => {
    secondsLeft--;
    if (secondsLeft <= 0) {
      clearInterval(cooldownInterval);
      btn.disabled = false;
      msgEl.textContent = "";
    } else {
      msgEl.textContent = `aitah kirjuta ${secondsLeft} sek prst uuesti`;
    }
  }, 1000);
}

window.addEventListener("load", () => {
  const lastSent = parseInt(localStorage.getItem("lastSent") || "0");
  const now = Date.now();
  const left = 60000 - (now - lastSent);
  if (left > 0) startCooldown(Math.ceil(left / 1000));
});

//pass
document.getElementById("enterBtn").addEventListener("click", function() {
  const pass = document.getElementById("password").value;
  if (pass === "tyngamees") {             //sa nq sitaks pd aga sitaks taku vana kui sa inspectisid webi et see pass leida. respect vana tra
    const page1 = document.getElementById("page1");
    page1.style.transition = "opacity 0.4s ease";
    page1.style.opacity = "0";
    setTimeout(() => {
      page1.style.display = "none";
      const page2 = document.getElementById("page2");
      page2.style.display = "flex";
      page2.style.opacity = "0";
      void page2.offsetWidth;
      page2.style.transition = "opacity 0.4s ease";
      page2.style.opacity = "1";
    }, 420);
  } else {
    alert("k6tt pd!");
  }
});
let isSending = false; //global lock?

document.getElementById("sendBtn").addEventListener("click", async function() {
  if (isSending) return;
  isSending = true;

  const COOLDOWN = 60000;
  let lastSent = parseInt(localStorage.getItem("lastSent") || "0");
  const now = Date.now();
  const left = COOLDOWN - (now - lastSent);

  if (left > 0) {
    startCooldown(Math.ceil(left / 1000));
    isSending = false;
    return;
  }

  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text) {
    isSending = false;
    return;
  }

  try {
    const pihtNr = await db.runTransaction(async (transaction) => {
      const counterRef = db.collection("counters").doc("pihid");
      const counterDoc = await transaction.get(counterRef);
      let lastId = counterDoc.exists ? (counterDoc.data().lastId || 0) : 0;
      const newId = lastId + 1;
      transaction.set(counterRef, { lastId: newId }, { merge: true });
      return newId;
    });

    await db.collection("messages").add({
      text: text,
      time: now,
      likes: 0,
      pihtNr: pihtNr
    });

    localStorage.setItem("lastSent", now);
    input.value = "";
    startCooldown(COOLDOWN / 1000);

  } catch (err) {
    console.error("Viga:", err);
  } finally {
    isSending = false;
  }
});

//realtime load vms
db.collection("messages").onSnapshot(snapshot => {
  const el = document.getElementById("messages");
  el.innerHTML = "";
  const list = [];
  snapshot.forEach(doc => {
    list.push({ id: doc.id, ...doc.data() });
  });
  list.sort((a,b) => b.time - a.time);

  const likedMessages = JSON.parse(localStorage.getItem("likedMessages") || "[]");

  list.forEach(m => {
    if (!m.text || !m.time) return;
    const div = document.createElement("div");
    div.className = "message";
    const d = new Date(m.time);
    const t = d.getDate() + "." + (d.getMonth()+1) + " " +
              d.getHours().toString().padStart(2,"0") + ":" +
              d.getMinutes().toString().padStart(2,"0");

    const pihtNumber = m.pihtNr != null ? `#${m.pihtNr.toString().padStart(4, '0')}` : "#????";
    const likes = m.likes || 0;
    const isLiked = likedMessages.includes(m.id);
    const heart = isLiked ? "♥" : "♡";
    const heartClass = isLiked ? "liked" : "";

    div.innerHTML = `
      <small>${t}</small>
      <span class="piht-nr">${pihtNumber}</span>
      <br>
      ${m.text}
      <div style="margin-top:8px;">
        <span class="like-btn ${heartClass}" data-id="${m.id}">${heart}</span>
        <span class="like-count">${likes > 0 ? likes : ''}</span>
      </div>
    `;
    el.appendChild(div);

    //facebook tix
    const btn = div.querySelector(".like-btn");
    btn.addEventListener("click", function() {
      const msgId = this.dataset.id;
      let likedArr = JSON.parse(localStorage.getItem("likedMessages") || "[]");
      let newLikes = likes;

      if (this.classList.contains("liked")) {
        //unlike
        this.textContent = "♡";
        this.classList.remove("liked");
        newLikes = Math.max(0, (parseInt(this.nextElementSibling.textContent) || 1) - 1);
        this.nextElementSibling.textContent = newLikes > 0 ? newLikes : '';
        likedArr = likedArr.filter(id => id !== msgId);
        db.collection("messages").doc(msgId).update({ likes: firebase.firestore.FieldValue.increment(-1) });
      } else {
        //like
        this.textContent = "♥";
        this.classList.add("liked");
        newLikes = (parseInt(this.nextElementSibling.textContent) || 0) + 1;
        this.nextElementSibling.textContent = newLikes;
        this.style.transform = "scale(1.4)";
        setTimeout(() => { this.style.transform = ""; }, 180);
        likedArr.push(msgId);
        db.collection("messages").doc(msgId).update({ likes: firebase.firestore.FieldValue.increment(1) });
      }

      localStorage.setItem("likedMessages", JSON.stringify(likedArr));
    });
  });
});
</script>
</body>
</html>
